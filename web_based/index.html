<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <meta name="description" content="A modern, web-based Connect Four game.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Connect Four</h1>
            <div class="status-panel">
                <div class="player-turn active red-turn" id="turn-indicator">
                    <span class="disc-indicator"></span>
                    <h2 id="turn-text">Player 1's Turn</h2>
                </div>
                <button id="reset-btn" class="modern-btn">Reset Game</button>
            </div>
        </header>

        <main class="board-wrapper">
            <div id="game-board" class="game-board">
                <!-- Columns and cells will be generated by JS -->
            </div>
        </main>
        
        <!-- Start Modal (asks for names) -->
        <div id="start-modal" class="modal">
            <div class="modal-content">
                <h2 id="win-message" style="margin-bottom: 2rem; font-size: 2.5rem; text-shadow: 0 0 20px rgba(255,255,255,0.2);">Welcome to Connect Four</h2>
                <div class="input-group">
                    <label for="p1-name">Player 1 (Red)</label>
                    <input type="text" id="p1-name" placeholder="Enter Name" value="Player 1">
                </div>
                <div class="input-group">
                    <label for="p2-name">Player 2 (Yellow)</label>
                    <input type="text" id="p2-name" placeholder="Enter Name" value="Player 2">
                </div>
                <button id="start-btn" class="modern-btn primary" style="width: 100%; margin-top: 1rem;">Start Match</button>
            </div>
        </div>

        <!-- Win/Draw Modal -->
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="end-message">Player 1 Wins!</h2>
                <button id="play-again-btn" class="modern-btn primary">Play Again</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
